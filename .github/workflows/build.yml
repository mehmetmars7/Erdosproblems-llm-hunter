name: Build and Deploy Problem Hunting Site

on:
  push:
    branches: [main]
    paths:
      - 'attacks/**'
      - 'lists/**'
      - 'reviews/**'
      - 'scripts/**'
      - 'build_site.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test data build and review validation
        run: python -m unittest discover -s tests

      - name: Test frontend
        run: |
          for test_file in tests/test_*.js; do
            node "$test_file"
          done

      - name: Refresh Erdos problem statuses
        run: |
          if ! python scripts/sync_erdos_status.py; then
            echo "::warning::Status refresh failed; building with the checked-in Erdos status snapshot."
            test -s lists/erdos_status.json
          fi

      - name: Build site data
        run: python build_site.py

      - name: Verify generated data exists
        run: |
          test -f docs/data/erdos_data.js
          test -f docs/data/mo_data.js
          test -f docs/data/open_problems_data.js
          test -f docs/data/economics_data.js
          test -f docs/data/stats.js
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
